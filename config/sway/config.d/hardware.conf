# Input
input * {
    xkb_options caps:escape,compose:ralt
}

input type:touchpad {
    natural_scroll enabled
    accel_profile adaptive
    scroll_factor 0.5
}

# Touch and pen stay on the panel instead of spanning the external monitor.
input type:touch map_to_output eDP-1
input type:tablet_tool map_to_output eDP-1

# Outputs
output * bg #000000 solid_color
output eDP-1 pos 0 0

# On an eGPU-only boot the Intel driver is off and the panel shows up as "Unknown-1".
# Keep it dark so only the eGPU outputs are used.
output "Unknown-1" disable

output 'ASUSTek COMPUTER INC VG27AQA1A R4LMQS155042' mode 2560x1440@119.980Hz pos 1920 0

# Mirror the internal panel to the external monitor
bindsym $mod+Shift+m exec pkill wl-mirror || wl-mirror eDP-1
for_window [app_id="at.yrlf.wl_mirror"] fullscreen enable

# On lid close move the external monitor to the origin, or a phantom gap stays on the left.
# The pos change must come before exec, sway's exec eats the rest of the line.
bindswitch --locked lid:on output 'ASUSTek COMPUTER INC VG27AQA1A R4LMQS155042' pos 0 0, exec $XDG_CONFIG_HOME/sway/scripts/lid_edp.sh
bindswitch --locked lid:off output eDP-1 enable, output 'ASUSTek COMPUTER INC VG27AQA1A R4LMQS155042' pos 1920 0
