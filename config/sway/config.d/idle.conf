# swaylock -f forks once the lock surface is drawn, so before-sleep waits for a real lock.
# after-resume locks again before powering outputs on, or the lid flashes the desktop for a frame.
exec swayidle -w \
    lock 'swaylock -f' \
    before-sleep 'swaylock -f' \
    after-resume 'swaylock -f; swaymsg "output * power on"'
