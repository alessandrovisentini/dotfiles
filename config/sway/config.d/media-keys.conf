# Media keys, play and stop also work while locked
bindsym --locked {
    XF86AudioPlay       exec playerctl play-pause
    XF86AudioStop       exec playerctl stop
}

bindsym {
    XF86AudioForward    exec playerctl position +10
    XF86AudioNext       exec playerctl next
    XF86AudioPause      exec playerctl pause
    XF86AudioPrev       exec playerctl previous
    XF86AudioRewind     exec playerctl position -10
}

# Volume (works while locked)
set $volume_helper_cmd $XDG_CONFIG_HOME/sway/scripts/volume_helper.sh
bindsym --locked {
    XF86AudioRaiseVolume exec \
        $volume_helper_cmd --limit 100 --increase 5
    XF86AudioLowerVolume exec \
        $volume_helper_cmd --limit 100 --decrease 5
    XF86AudioMute    exec pactl set-sink-mute @DEFAULT_SINK@ toggle && $volume_helper_cmd
    XF86AudioMicMute exec pactl set-source-mute @DEFAULT_SOURCE@ toggle
}

# Brightness
set $brightness_helper_cmd $XDG_CONFIG_HOME/sway/scripts/brightness_helper.sh
bindsym XF86MonBrightnessDown exec $brightness_helper_cmd down 5
bindsym XF86MonBrightnessUp exec $brightness_helper_cmd up 5
