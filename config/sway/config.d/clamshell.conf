# Closing the lid moves the external monitor to 0 0 to avoid a weird phantom band, and turns off
# the laptop panel when in clamshell. --reload runs it again on config reload turning eDP-1 back on
bindswitch --locked --reload lid:on output 'ASUSTek COMPUTER INC VG27AQA1A R4LMQS155042' pos 0 0, exec_always $HOME/.config/sway/scripts/lid_edp.sh
bindswitch --locked lid:off output eDP-1 enable, output 'ASUSTek COMPUTER INC VG27AQA1A R4LMQS155042' pos 1920 0
