# Battery notification
exec_always $HOME/.config/sway/scripts/battery_notification.sh

# Push PATH and friends to systemd and D-Bus first, or activated apps get a bare PATH and GIO
# hides every handler whose TryExec is not on it. Explicit list, --all would leak TMUX vars too.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP SWAYSOCK DISPLAY PATH XDG_DATA_DIRS

# Notifications
exec swaync

exec nm-applet --indicator

exec blueman-applet
